actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Workiz's own public API is
    request/response REST (token-in-path) plus outbound webhooks for new-job and
    new-lead events. No AsyncAPI document was created because there is no
    server-push WebSocket or SSE transport on Workiz's own API to model; the
    asynchronous delivery is HTTP webhook callbacks to customer endpoints.
