meters:
- name: subscription_seats
  description: Number of team-member seats on the plan, the primary billing driver.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: plan_tier
  description: Subscription tier (Lite, Standard, Pro, Ultimate) that sets base price and feature caps.
  unit: plan
  aggregation: max
  dimensions:
  - account
- name: payment_processing
  description: Transaction fees on payments processed through Workiz, where used (separate from subscription).
  unit: transactions
  aggregation: sum
  dimensions:
