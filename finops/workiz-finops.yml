description: >-
  FinOps view of Workiz spend. Workiz is a per-team SaaS subscription rather than
  a usage-metered API. Cost is driven by the chosen plan tier (Lite free,
  Standard, Pro, Ultimate/Enterprise) and the number of seats (team members),
  billed monthly with an annual-commitment discount. The Developer API is an
  included add-on and is not separately metered, so programmatic access does not
  add per-call charges. Variable costs outside the subscription can include
  integrated payment processing fees and communications (calls/SMS) usage where
  applicable. Because billing is seat-based, the primary optimization levers are
  right-sizing the plan tier and the number of active seats.
notes: >-
  Plan and seat prices are not reconciled here and vary across aggregators;
  verify on the Workiz pricing page. Payment processing and communications fees,
  if used, are separate from the SaaS subscription.
