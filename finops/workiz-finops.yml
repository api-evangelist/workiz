principles:
- name: Visibility
  description: Track active seats and plan tier against the monthly invoice; separate SaaS subscription from payment-processing and communications fees.
- name: Allocation
  description: Map seats to crews/roles so the subscription cost attributes to the teams using Workiz.
- name: Optimization
  description: Right-size the plan tier and deactivate unused seats; use the included Developer API to automate rather than buying additional tooling.
- name: Accountability
  description: Assign an owner to review seat count and plan tier before each renewal, and reconcile payment-processing fees against revenue.
