  - url: openapi/workiz-openapi.yml
    type: OpenAPI
  - url: collections/workiz.postman_collection.json
    type: PostmanCollection
  - url: collections/workiz.opencollection.json
    type: OpenCollection
  description: List team members (technicians, dispatchers, and office users) and
    retrieve a single team member by user ID. Team members are the users you assign
    to jobs and whose availability and time off drive scheduling.
