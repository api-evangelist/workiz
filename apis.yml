    type: OpenAPI
  - url: collections/workiz.postman_collection.json
    type: PostmanCollection
  - url: collections/workiz.opencollection.json
    type: OpenCollection
  description: List and retrieve jobs, create and update jobs, and assign or unassign
    team members to a job. Jobs are the core work order in Workiz and carry the
    client details, location, scheduled time, line items, status, and assigned crew.
    List queries support filters such as records, offset, only_open, and status.
- aid: workiz:workiz-leads-api
  name: Workiz Leads API
  tags:
  - Leads
  - CRM
  - Sales
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.workiz.com/
  baseURL: https://api.workiz.com/api/v1
  properties:
  - url: https://developer.workiz.com/
    type: Documentation
  - url: openapi/workiz-openapi.yml
    type: OpenAPI
  - url: collections/workiz.postman_collection.json
    type: PostmanCollection
  - url: collections/workiz.opencollection.json
    type: OpenCollection
  description: List and retrieve leads and manage their lifecycle - create and update
    leads and mark a lead as active or lost. Leads are prospective work that can be
    converted into jobs. List and single-record reads are confirmed in the public
    API; write and status-change operations are exposed through Workiz integration
    partners and modeled here.
- aid: workiz:workiz-team-api
  name: Workiz Team API
