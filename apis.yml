  - url: openapi/workiz-openapi.yml
    type: OpenAPI
  - url: collections/workiz.postman_collection.json
    type: PostmanCollection
  - url: collections/workiz.opencollection.json
    type: OpenCollection
  description: Record a payment against a job by its UUID. Workiz tracks invoices,
    estimates, and payments against jobs; the public API surfaces adding a payment
    to a job, which advances the job toward a paid state.
- aid: workiz:workiz-webhooks
  name: Workiz Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.workiz.com/
  baseURL: https://api.workiz.com/api/v1
  properties:
  - url: https://developer.workiz.com/
    type: Documentation
  - url: openapi/workiz-openapi.yml
    type: OpenAPI
  description: Outbound webhooks that push events to a configured HTTPS endpoint when
    a new job is created or a new lead arrives, enabling near-real-time integrations
    without polling. Workiz posts the event payload to your URL. This is server-to-endpoint
    HTTP delivery, not a WebSocket. Webhook subscription is offered through the
    Developer API add-on and Workiz integration partners; the endpoint payloads are
    modeled here.
