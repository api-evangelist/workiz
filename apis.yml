aid: workiz
url: https://raw.githubusercontent.com/api-evangelist/workiz/refs/heads/main/apis.yml
name: Workiz
kind: company
description: Workiz is field service management (FSM) software for home-service
  businesses - HVAC, plumbing, electrical, appliance repair, garage doors, locksmiths,
  carpet cleaning, and similar trades. It combines scheduling and dispatch, a CRM,
  jobs and leads, estimates and invoicing, payments, and communications (calls, SMS,
  email) in one platform. Workiz exposes a documented REST API (the Developer API
  add-on) for reading and writing jobs, leads, team members, time off, and payments,
  plus outbound webhooks for new-job and new-lead events. All calls are made to
  https://api.workiz.com/api/v1/ with the account API token embedded in the request
  path.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Field Service Management
- FSM
- Home Services
- Scheduling
- Dispatch
- CRM
